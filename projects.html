<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>akisarke@links:~/projects$</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='10' y='.9em' font-size='70' fill='%2339d353'>~$</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #0d0d0d;
color: #c8c8c8;
font-family: 'JetBrains Mono', 'Courier New', monospace;
font-size: 14px;
line-height: 1.6;
min-height: 100vh;
}
#main-content {
padding: 32px 24px;
max-width: 900px;
margin: 0 auto;
}
.line {
display: block;
white-space: pre;
}
.g { color: #39d353; }
.c { color: #58d8f0; }
.y { color: #f0c040; }
.p { color: #b48eff; }
.m { color: #555; }
.b { font-weight: 700; }
.prompt::before {
content: 'akisarke@links:~/projects$ ';
color: #39d353;
font-weight: 700;
}
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; }
.back-link { color: #58d8f0; }
.back-link:hover { color: #fff; }

#repo-list {
margin-top: 8px;
}
.repo-card {
border: 1px solid #262626;
border-left: 3px solid #39d353;
padding: 12px 16px;
margin-bottom: 12px;
transition: border-color 0.15s, background 0.15s;
}
.repo-card:hover {
border-color: #39d353;
background: #121212;
}
.repo-name {
color: #58d8f0;
font-weight: 700;
font-size: 15px;
}
.repo-name:hover { color: #fff; }
.repo-desc {
color: #c8c8c8;
margin-top: 4px;
white-space: normal;
}
.repo-meta {
margin-top: 6px;
color: #555;
font-size: 12px;
white-space: normal;
}
.repo-meta .lang { color: #f0c040; }
.repo-meta .stars { color: #b48eff; }
.status-msg {
color: #555;
margin-top: 8px;
}
.status-msg.err { color: #ff6b6b; }
.repo-meta .wip-badge {
color: #39d353;
font-weight: 700;
text-decoration: underline;
}

@media (max-width: 600px) {
body { font-size: 12px; }
#main-content { padding: 18px 12px; }
.prompt::before { content: 'aki@links:~/projects$ '; }
}
</style>
</head>
<body>
<div id="main-content">
<span class="line"><span class="m">Linux links-vm 6.1.0 #1 SMP x86_64 GNU/Linux</span></span>
<span class="line"> </span>
<span class="line"><a href="index.html" class="back-link">&larr; back</a></span>
<span class="line"> </span>
<span class="line prompt">curl -s https://api.github.com/users/akisarke/repos | jq</span>
<span class="line"> </span>
<div id="status" class="status-msg">fetching repos…</div>
<div id="repo-list"></div>
</div>

<script>
(function () {
const USERNAME = 'akisarke';
// Repos to always exclude
const EXCLUDE = new Set(['akisarke', 'akisarke.github.io']);

const statusEl = document.getElementById('status');
const listEl = document.getElementById('repo-list');

function escapeHtml(str) {
const div = document.createElement('div');
div.textContent = str;
return div.innerHTML;
}

function timeAgo(dateStr) {
const d = new Date(dateStr);
const diffMs = Date.now() - d.getTime();
const days = Math.floor(diffMs / 86400000);
if (days < 1) return 'today';
if (days === 1) return '1 day ago';
if (days < 30) return days + ' days ago';
const months = Math.floor(days / 30);
if (months < 12) return months + (months === 1 ? ' month ago' : ' months ago');
const years = Math.floor(months / 12);
return years + (years === 1 ? ' year ago' : ' years ago');
}

function fetchLanguages(repo) {
return fetch(repo.languages_url)
.then(function (res) { return res.ok ? res.json() : {}; })
.then(function (langObj) {
// Sort languages by byte count
return Object.keys(langObj).sort(function (a, b) { return langObj[b] - langObj[a]; });
})
.catch(function () { return repo.language ? [repo.language] : []; });
}

// Matches WIP keyword in README
const WIP_PATTERN = /\b(wip|work[\s-]in[\s-]progress)\b/i;

function decodeBase64Utf8(b64) {
const binary = atob(b64.replace(/\n/g, ''));
const bytes = new Uint8Array(binary.length);
for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
return new TextDecoder('utf-8').decode(bytes);
}

function fetchIsWip(repo) {
return fetch('https://api.github.com/repos/' + USERNAME + '/' + repo.name + '/readme')
.then(function (res) { return res.ok ? res.json() : null; })
.then(function (data) {
if (!data || !data.content) return false;
const text = decodeBase64Utf8(data.content);
return WIP_PATTERN.test(text);
})
.catch(function () { return false; });
}

function render(repos, languagesByRepo, wipByRepo) {
listEl.innerHTML = '';

if (repos.length === 0) {
statusEl.textContent = 'no public repos found.';
return;
}

statusEl.textContent = '# ' + repos.length + ' project' + (repos.length === 1 ? '' : 's') + ' found';

repos.forEach(function (repo, i) {
const card = document.createElement('div');
card.className = 'repo-card';

const nameLink = document.createElement('a');
nameLink.className = 'repo-name';
nameLink.href = repo.homepage && repo.homepage.trim() ? repo.homepage : repo.html_url;
nameLink.target = '_blank';
nameLink.rel = 'noopener';
nameLink.textContent = repo.name + (repo.fork ? ' (fork)' : '');
card.appendChild(nameLink);

if (repo.description) {
const desc = document.createElement('div');
desc.className = 'repo-desc';
desc.textContent = repo.description;
card.appendChild(desc);
}

const meta = document.createElement('div');
meta.className = 'repo-meta';
const parts = [];
const langs = languagesByRepo[i];
if (langs && langs.length) parts.push('<span class="lang">' + escapeHtml(langs.join(', ')) + '</span>');
parts.push('<span class="stars">★ ' + repo.stargazers_count + '</span>');
parts.push('updated ' + timeAgo(repo.pushed_at || repo.updated_at));
if (wipByRepo[i]) parts.push('<span class="wip-badge">WIP</span>');
meta.innerHTML = parts.join('  ·  ');
card.appendChild(meta);

listEl.appendChild(card);
});
}

fetch('https://api.github.com/users/' + USERNAME + '/repos?per_page=100&sort=pushed')
.then(function (res) {
if (!res.ok) throw new Error('GitHub API returned ' + res.status);
return res.json();
})
.then(function (repos) {
const filtered = repos
.filter(function (r) { return !EXCLUDE.has(r.name); })
.filter(function (r) { return !r.private; });

statusEl.textContent = 'fetching languages…';

return Promise.all([
Promise.all(filtered.map(fetchLanguages)),
Promise.all(filtered.map(fetchIsWip))
]).then(function (results) {
render(filtered, results[0], results[1]);
});
})
.catch(function (err) {
statusEl.innerHTML = 'couldn\'t load projects from GitHub (' + escapeHtml(err.message) +
'). visit <a href="https://github.com/' + USERNAME + '" target="_blank" rel="noopener" class="back-link">github.com/' + USERNAME + '</a> instead.';
statusEl.classList.add('err');
});
})();
</script>
</body>
</html>
